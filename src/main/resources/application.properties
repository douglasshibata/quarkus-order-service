# Quarkus configuration properties
quarkus.application.name=quarkus-order-service

# Database settings (PostgreSQL Reactive Client)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=postgres
quarkus.datasource.reactive.url=postgresql://localhost:5432/orders_db
quarkus.hibernate-orm.database.generation=update

# Logging configuration
quarkus.log.level=INFO
quarkus.log.category."com.empresa.order".level=DEBUG

# SmallRye Reactive Messaging - Kafka Configs
kafka.bootstrap.servers=localhost:9092

# Outgoing: orders-out -> orders-events (Kafka)
mp.messaging.outgoing.orders-out.connector=smallrye-kafka
mp.messaging.outgoing.orders-out.topic=orders-events
mp.messaging.outgoing.orders-out.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer

# Incoming: payments-in -> payments-events (Kafka)
mp.messaging.incoming.payments-in.connector=smallrye-kafka
mp.messaging.incoming.payments-in.topic=payments-events
mp.messaging.incoming.payments-in.value.deserializer=com.empresa.order.consumer.PaymentEventDeserializer
mp.messaging.incoming.payments-in.auto.offset.reset=earliest

# Disable DevServices for Docker-free offline compilation/runs if needed
quarkus.devservices.enabled=false

# Test profile overrides to bypass database connection on boot
%test.quarkus.hibernate-orm.active=false
%test.quarkus.devservices.enabled=false
%test.quarkus.reactive-pg-client.active=false
